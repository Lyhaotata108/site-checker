<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>网站维护状态管理</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@400;600;700&display=swap');
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0e0e10;--surface:#18181c;--surface2:#202027;--border:#2a2a30;--border2:#3a3a44;
    --text:#f0f0f4;--muted:#92929f;--accent:#7fff7f;--accent-dim:#173617;
    --warn:#ffd060;--warn-dim:#3a3010;--err:#ff6868;--err-dim:#3a1010;
    --review:#a78bfa;--review-dim:#2a1a4a;--blue:#60c0ff;--blue-dim:#0a2a3a;
    --mono:'IBM Plex Mono',monospace;--sans:'Syne',sans-serif;
  }
  body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;padding:42px 22px 80px}
  .container{max-width:1280px;margin:auto}
  header{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:30px}
  header h1{font-size:clamp(28px,5vw,42px);line-height:1.08;letter-spacing:-.03em;margin-bottom:8px}
  header h1 span{color:var(--accent)}
  header p{font:12px/1.7 var(--mono);color:var(--muted);max-width:720px}
  .storage-note{font:11px/1.5 var(--mono);color:var(--warn);border:1px solid var(--warn-dim);background:rgba(255,208,96,.05);padding:10px 12px;border-radius:9px;max-width:300px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:13px;margin-bottom:16px;overflow:hidden}
  .card-head{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .card-title{font-size:15px;font-weight:700}.card-sub{font:11px var(--mono);color:var(--muted);margin-top:4px}
  textarea{width:100%;min-height:130px;padding:16px 18px;background:transparent;color:var(--text);border:0;outline:0;resize:vertical;font:13px/1.8 var(--mono)}
  textarea::placeholder{color:#686874}
  .toolbar,.actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .toolbar{padding:11px 14px;border-top:1px solid var(--border)}
  .count{margin-right:auto;color:var(--muted);font:12px var(--mono)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:8px;border:1px solid var(--border2);background:transparent;color:var(--muted);font:600 12px var(--sans);cursor:pointer;transition:.15s;white-space:nowrap}
  .btn:hover{color:var(--text);border-color:var(--text)}
  .btn.primary{background:var(--accent);color:#0a190a;border-color:var(--accent)}
  .btn.primary:hover{opacity:.88}.btn.primary:disabled{opacity:.35;cursor:not-allowed}
  .btn.danger{border-color:var(--err);color:var(--err)}.btn.danger:hover{background:var(--err-dim)}
  .btn.blue{border-color:var(--blue);color:var(--blue)}.btn.blue:hover{background:var(--blue-dim)}
  input[type="file"]{display:none}
  .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:11px;margin-bottom:16px}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:14px 16px}
  .stat-label{font:10px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px}
  .stat-val{font-size:25px;font-weight:700}.stat-val.green{color:var(--accent)}.stat-val.yellow{color:var(--warn)}.stat-val.red{color:var(--err)}.stat-val.purple{color:var(--review)}
  .progress-wrap{display:none;margin:17px 0}
  .progress-info{display:flex;justify-content:space-between;color:var(--muted);font:12px var(--mono);margin-bottom:8px}
  .progress-bar{height:3px;background:var(--border);border-radius:99px;overflow:hidden}.progress-fill{height:100%;width:0;background:var(--accent);transition:width .25s}
  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:13px 14px;border-bottom:1px solid var(--border)}
  .ftab{padding:6px 12px;border:1px solid var(--border2);border-radius:20px;background:transparent;color:var(--muted);font:11px var(--mono);cursor:pointer}
  .ftab.active{background:var(--text);color:var(--bg);border-color:var(--text)}
  .search{margin-left:auto;min-width:220px;padding:8px 10px;border:1px solid var(--border2);border-radius:8px;background:var(--bg);color:var(--text);outline:0;font:12px var(--mono)}
  .bulkbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:11px 14px;background:var(--surface2);border-bottom:1px solid var(--border)}
  .bulkbar span{font:11px var(--mono);color:var(--muted)}
  select,.note-input{background:var(--bg);border:1px solid var(--border2);border-radius:7px;color:var(--text);padding:7px 9px;font:11px var(--mono);outline:none}
  select:focus,.note-input:focus,.search:focus{border-color:var(--accent)}
  .table-shell{overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:1060px}
  th{padding:9px 11px;text-align:left;border-bottom:1px solid var(--border);font:10px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.07em;white-space:nowrap}
  td{padding:10px 11px;border-bottom:1px solid var(--border);font-size:12px;vertical-align:middle}
  tr:last-child td{border-bottom:0}tr:hover td{background:rgba(255,255,255,.018)}
  .domain-link{color:var(--text);font:12px var(--mono);text-decoration:none}.domain-link:hover{color:var(--accent)}
  .note-input{width:100%;min-width:180px}
  .badge{display:inline-flex;padding:4px 9px;border-radius:99px;font:10px var(--mono);white-space:nowrap}
  .badge.ok{background:var(--accent-dim);color:var(--accent)}.badge.warn{background:var(--warn-dim);color:var(--warn)}.badge.err{background:var(--err-dim);color:var(--err)}.badge.review{background:var(--review-dim);color:var(--review)}.badge.muted{background:var(--border);color:var(--muted)}
  .tag-note{color:var(--warn);font:10px var(--mono);margin-top:4px}.meta{font:10px/1.5 var(--mono);color:var(--muted)}
  .icon-btn{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:5px}.icon-btn:hover{color:var(--err)}
  .empty{padding:36px;text-align:center;color:var(--muted);font:12px var(--mono)}
  .result-card{display:none}.result-actions{padding:11px 14px;border-bottom:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap}
  .toast{position:fixed;right:20px;bottom:20px;padding:11px 14px;background:var(--text);color:var(--bg);border-radius:8px;font:12px var(--mono);opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s;z-index:50}.toast.show{opacity:1;transform:translateY(0)}
  @media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}header{flex-direction:column}.storage-note{max-width:none}.search{margin-left:0;width:100%}}
  @media(max-width:620px){body{padding:24px 12px 60px}.stats{grid-template-columns:1fr 1fr}.toolbar .count{width:100%;margin:0}.btn{flex:1}.card-head{align-items:flex-start}.actions{width:100%}}
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1>网站维护<span>状态管理</span></h1>
      <p>// 域名只需录入一次 · 有标签的域名自动跳过 · 仅检测无标签域名 · 数据保存在当前浏览器</p>
    </div>
    <div class="storage-note">⚠ 本地模式：请定期导出 CSV 备份。更换浏览器、无痕模式或清除网站数据后，本地记录可能丢失。</div>
  </header>

  <section class="card">
    <div class="card-head">
      <div><div class="card-title">批量添加域名</div><div class="card-sub">每行一个；重复域名会自动忽略</div></div>
      <div class="actions">
        <button class="btn" id="importBtn">导入 CSV</button>
        <input type="file" id="importFile" accept=".csv,text/csv">
        <button class="btn" id="exportLibraryBtn">导出域名库</button>
      </div>
    </div>
    <textarea id="domainInput" placeholder="example.com&#10;example.org&#10;https://example.net"></textarea>
    <div class="toolbar">
      <span class="count" id="inputCount">0 个有效域名</span>
      <button class="btn" id="clearInputBtn">清空输入</button>
      <button class="btn primary" id="addBtn" disabled>添加到域名库</button>
    </div>
  </section>

  <div class="stats">
    <div class="stat"><div class="stat-label">全部域名</div><div class="stat-val" id="statTotal">0</div></div>
    <div class="stat"><div class="stat-label">待检测（无标签）</div><div class="stat-val green" id="statActive">0</div></div>
    <div class="stat"><div class="stat-label">已跳过（有标签）</div><div class="stat-val yellow" id="statSkipped">0</div></div>
    <div class="stat"><div class="stat-label">最近正常</div><div class="stat-val green" id="statOk">0</div></div>
    <div class="stat"><div class="stat-label">最近需处理</div><div class="stat-val red" id="statProblem">0</div></div>
  </div>

  <div class="actions" style="margin-bottom:16px">
    <button class="btn primary" id="checkActiveBtn">检测全部无标签域名</button>
    <button class="btn blue" id="checkSelectedBtn">检测选中域名</button>
    <span class="meta" id="checkSummary">有标签的域名不会参与“全部检测”</span>
  </div>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-info"><span id="progressLabel">准备检测</span><span id="progressNum">0 / 0</span></div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <section class="card">
    <div class="card-head">
      <div><div class="card-title">域名库</div><div class="card-sub">任何非空标签都会自动排除检测；清除标签即可恢复检测</div></div>
    </div>
    <div class="filters">
      <button class="ftab active" data-filter="all">全部</button>
      <button class="ftab" data-filter="active">待检测</button>
      <button class="ftab" data-filter="skipped">已跳过</button>
      <button class="ftab" data-filter="unchecked">未检测</button>
      <button class="ftab" data-filter="ok">最近正常</button>
      <button class="ftab" data-filter="problem">最近需处理</button>
      <input class="search" id="searchInput" placeholder="搜索域名、标签或备注">
    </div>
    <div class="bulkbar">
      <label><input type="checkbox" id="selectVisible"> <span>选择当前列表</span></label>
      <span id="selectedCount">已选 0 个</span>
      <select id="bulkLabel">
        <option value="">清除标签（恢复检测）</option>
        <option value="已下线">已下线</option>
        <option value="未建站">未建站 / 备用域名</option>
        <option value="暂停维护">暂停维护</option>
        <option value="其他">其他</option>
      </select>
      <button class="btn" id="applyBulkLabelBtn">应用标签</button>
      <button class="btn danger" id="deleteSelectedBtn">删除选中</button>
    </div>
    <div class="table-shell">
      <table>
        <thead><tr><th></th><th>域名</th><th>标签</th><th>备注</th><th>最近状态</th><th>状态码</th><th>最后检测</th><th>操作</th></tr></thead>
        <tbody id="domainTable"></tbody>
      </table>
    </div>
  </section>

  <section class="card result-card" id="resultCard">
    <div class="card-head"><div><div class="card-title">本次检测结果</div><div class="card-sub" id="resultSubtitle"></div></div></div>
    <div class="result-actions">
      <button class="btn" id="exportResultsBtn">导出本次结果</button>
      <button class="btn" id="copyProblemsBtn">复制需处理域名</button>
    </div>
    <div class="table-shell">
      <table>
        <thead><tr><th>域名</th><th>状态</th><th>首次码</th><th>最终码</th><th>响应时间</th><th>SSL</th><th>手机端</th><th>图片</th><th>说明</th></tr></thead>
        <tbody id="resultTable"></tbody>
      </table>
    </div>
  </section>
</div>
<div class="toast" id="toast"></div>
<script>
'use strict';
const STORAGE_KEY='siteCheckerDomainLibraryV1';
const LABELS=['','已下线','未建站','暂停维护','其他'];
let domains=loadDomains();
let selected=new Set();
let currentFilter='all';
let currentResults=[];

const $=id=>document.getElementById(id);
const domainInput=$('domainInput');

function loadDomains(){
  try{
    const value=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');
    if(!Array.isArray(value)) return [];
    return value.map(item=>({
      domain:String(item.domain||'').toLowerCase(),label:String(item.label||''),note:String(item.note||''),
      lastStatus:String(item.lastStatus||''),lastCode:item.lastCode??'',lastNote:String(item.lastNote||''),
      lastChecked:String(item.lastChecked||''),lastResult:item.lastResult||null,createdAt:String(item.createdAt||new Date().toISOString())
    })).filter(item=>item.domain);
  }catch{return []}
}
function saveDomains(){localStorage.setItem(STORAGE_KEY,JSON.stringify(domains))}
function toast(message){const el=$('toast');el.textContent=message;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2200)}
function canonicalDomain(raw){
  let value=String(raw||'').trim();
  if(!value||value.startsWith('#')) return '';
  try{
    if(!/^https?:\/\//i.test(value)) value='https://'+value;
    const url=new URL(value);return url.hostname.toLowerCase().replace(/^www\./,'');
  }catch{return ''}
}
function parseInput(){return [...new Set(domainInput.value.split(/\r?\n/).map(canonicalDomain).filter(Boolean))]}
function isProblem(status){return status && status!=='正常'}
function statusClass(status){
  if(status==='正常') return 'ok';
  if(status==='待审核') return 'review';
  if(['重定向','需要认证','禁止访问','SSL错误','网关错误','内容异常','手机端异常','需关注'].includes(status)) return 'warn';
  return status?'err':'muted';
}
function formatDate(value){if(!value)return '—';const date=new Date(value);return Number.isNaN(date.getTime())?'—':date.toLocaleString('zh-CN',{hour12:false})}
function csvEscape(value){return '"'+String(value??'').replace(/"/g,'""')+'"'}
function download(content,filename,type){const blob=new Blob([content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function today(){return new Date().toISOString().slice(0,10)}

function updateInputCount(){const count=parseInput().length;$('inputCount').textContent=count+' 个有效域名';$('addBtn').disabled=count===0}
function addDomains(){
  const incoming=parseInput();const existing=new Set(domains.map(item=>item.domain));let added=0;
  incoming.forEach(domain=>{if(!existing.has(domain)){domains.push({domain,label:'',note:'',lastStatus:'',lastCode:'',lastNote:'',lastChecked:'',lastResult:null,createdAt:new Date().toISOString()});existing.add(domain);added++}});
  saveDomains();domainInput.value='';updateInputCount();renderAll();toast(added?`已添加 ${added} 个域名`:'没有新增域名');
}
function updateRecord(domain,patch){const item=domains.find(row=>row.domain===domain);if(!item)return;Object.assign(item,patch);saveDomains();renderAll()}
function deleteDomain(domain){if(!confirm(`确认删除 ${domain}？`))return;domains=domains.filter(item=>item.domain!==domain);selected.delete(domain);saveDomains();renderAll()}

function filteredDomains(){
  const keyword=$('searchInput').value.trim().toLowerCase();
  return domains.filter(item=>{
    const filterOk=currentFilter==='all'||
      (currentFilter==='active'&&!item.label)||(currentFilter==='skipped'&&!!item.label)||
      (currentFilter==='unchecked'&&!item.lastChecked)||(currentFilter==='ok'&&item.lastStatus==='正常')||
      (currentFilter==='problem'&&isProblem(item.lastStatus));
    const text=(item.domain+' '+item.label+' '+item.note).toLowerCase();return filterOk&&(!keyword||text.includes(keyword));
  });
}
function renderStats(){
  $('statTotal').textContent=domains.length;$('statActive').textContent=domains.filter(item=>!item.label).length;
  $('statSkipped').textContent=domains.filter(item=>item.label).length;$('statOk').textContent=domains.filter(item=>item.lastStatus==='正常').length;
  $('statProblem').textContent=domains.filter(item=>isProblem(item.lastStatus)).length;
  $('checkSummary').textContent=`无标签 ${domains.filter(item=>!item.label).length} 个 · 已跳过 ${domains.filter(item=>item.label).length} 个`;
  $('checkActiveBtn').disabled=!domains.some(item=>!item.label);
}
function renderDomainTable(){
  const tbody=$('domainTable');tbody.textContent='';const rows=filteredDomains();
  if(!rows.length){const tr=document.createElement('tr');const td=document.createElement('td');td.colSpan=8;td.className='empty';td.textContent='暂无符合条件的域名';tr.appendChild(td);tbody.appendChild(tr);return}
  rows.forEach(item=>{
    const tr=document.createElement('tr');
    const checkTd=document.createElement('td');const check=document.createElement('input');check.type='checkbox';check.checked=selected.has(item.domain);check.addEventListener('change',()=>{check.checked?selected.add(item.domain):selected.delete(item.domain);renderSelection()});checkTd.appendChild(check);
    const domainTd=document.createElement('td');const link=document.createElement('a');link.className='domain-link';link.href='https://'+item.domain;link.target='_blank';link.rel='noopener';link.textContent=item.domain+' ↗';domainTd.appendChild(link);if(item.label){const hint=document.createElement('div');hint.className='tag-note';hint.textContent='检测时自动跳过';domainTd.appendChild(hint)}
    const labelTd=document.createElement('td');const select=document.createElement('select');LABELS.forEach(label=>{const option=document.createElement('option');option.value=label;option.textContent=label||'无标签（参与检测）';option.selected=item.label===label;select.appendChild(option)});select.addEventListener('change',()=>updateRecord(item.domain,{label:select.value}));labelTd.appendChild(select);
    const noteTd=document.createElement('td');const note=document.createElement('input');note.className='note-input';note.value=item.note;note.placeholder='填写下线原因或其他备注';note.addEventListener('change',()=>updateRecord(item.domain,{note:note.value.trim()}));noteTd.appendChild(note);
    const statusTd=document.createElement('td');const badge=document.createElement('span');badge.className='badge '+statusClass(item.lastStatus);badge.textContent=item.lastStatus||'未检测';statusTd.appendChild(badge);if(item.lastNote){const detail=document.createElement('div');detail.className='meta';detail.title=item.lastNote;detail.textContent=item.lastNote.slice(0,36);statusTd.appendChild(detail)}
    const codeTd=document.createElement('td');codeTd.className='meta';codeTd.textContent=item.lastCode||'—';
    const checkedTd=document.createElement('td');checkedTd.className='meta';checkedTd.textContent=formatDate(item.lastChecked);
    const actionTd=document.createElement('td');const del=document.createElement('button');del.className='icon-btn';del.title='删除';del.textContent='删除';del.addEventListener('click',()=>deleteDomain(item.domain));actionTd.appendChild(del);
    [checkTd,domainTd,labelTd,noteTd,statusTd,codeTd,checkedTd,actionTd].forEach(td=>tr.appendChild(td));tbody.appendChild(tr);
  });
}
function renderSelection(){$('selectedCount').textContent=`已选 ${selected.size} 个`;$('selectVisible').checked=filteredDomains().length>0&&filteredDomains().every(item=>selected.has(item.domain))}
function renderAll(){renderStats();renderDomainTable();renderSelection()}

function applyBulkLabel(){if(!selected.size){alert('请先选择域名');return}const label=$('bulkLabel').value;domains.forEach(item=>{if(selected.has(item.domain))item.label=label});saveDomains();renderAll();toast(label?`已批量标记：${label}`:'已清除标签，恢复检测')}
function deleteSelected(){if(!selected.size){alert('请先选择域名');return}if(!confirm(`确认删除选中的 ${selected.size} 个域名？`))return;domains=domains.filter(item=>!selected.has(item.domain));selected.clear();saveDomains();renderAll();toast('已删除选中域名')}

async function startCheck(mode){
  const candidates=mode==='selected'?domains.filter(item=>selected.has(item.domain)):domains.filter(item=>!item.label);
  if(!candidates.length){alert(mode==='selected'?'没有选中域名':'没有需要检测的无标签域名');return}
  if(mode==='selected'&&candidates.some(item=>item.label)&&!confirm('选中项中包含有标签域名。仍然检测这些选中域名吗？'))return;
  $('checkActiveBtn').disabled=true;$('checkSelectedBtn').disabled=true;$('progressWrap').style.display='block';currentResults=[];
  const total=candidates.length;let done=0;const batchSize=8;
  for(let i=0;i<total;i+=batchSize){
    const batch=candidates.slice(i,i+batchSize).map(item=>item.domain);
    let results=[];
    try{
      const response=await fetch('/api/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({domains:batch})});
      if(!response.ok)throw new Error('HTTP '+response.status);const data=await response.json();results=Array.isArray(data.results)?data.results:[];
    }catch(error){results=batch.map(domain=>({domain,url:'https://'+domain,status:'请求失败',code:'—',firstCode:'—',rt:'—',ssl:'—',sslNote:'',mobileScore:'—',mobileNote:'',imgBroken:0,imgChecked:0,note:'无法连接到检测服务：'+error.message}))}
    const checkedAt=new Date().toISOString();results.forEach(result=>{currentResults.push(result);const item=domains.find(row=>row.domain===canonicalDomain(result.domain));if(item){item.lastStatus=result.status||'请求失败';item.lastCode=result.code??'—';item.lastNote=result.note||result.contentNote||'';item.lastChecked=checkedAt;item.lastResult=result}});
    saveDomains();done=Math.min(i+batchSize,total);$('progressFill').style.width=Math.round(done/total*100)+'%';$('progressNum').textContent=`${done} / ${total}`;$('progressLabel').textContent=`已完成 ${done} / ${total}`;renderAll();renderResults();
  }
  $('progressLabel').textContent='✓ 检测完成';$('checkActiveBtn').disabled=!domains.some(item=>!item.label);$('checkSelectedBtn').disabled=false;toast(`检测完成：${total} 个域名`);
}
function renderResults(){
  const card=$('resultCard');card.style.display='block';$('resultSubtitle').textContent=`本次共检测 ${currentResults.length} 个；正常 ${currentResults.filter(r=>r.status==='正常').length} 个；需处理 ${currentResults.filter(r=>r.status!=='正常').length} 个`;
  const tbody=$('resultTable');tbody.textContent='';currentResults.forEach(result=>{
    const tr=document.createElement('tr');
    const values=[result.domain,result.status,result.firstCode||'—',result.code||'—',result.rt||'—',(result.ssl||'—')+(result.sslNote?' '+result.sslNote:''),result.mobileScore||'—',result.imgChecked?`${Math.max(0,result.imgChecked-(result.imgBroken||0))}/${result.imgChecked} 可用`:'—',result.redirect_to?'→ '+result.redirect_to:(result.note||'')];
    values.forEach((value,index)=>{const td=document.createElement('td');if(index===0){const a=document.createElement('a');a.className='domain-link';a.href=result.url||'https://'+result.domain;a.target='_blank';a.rel='noopener';a.textContent=value;td.appendChild(a)}else if(index===1){const b=document.createElement('span');b.className='badge '+statusClass(value);b.textContent=value;td.appendChild(b)}else{td.className='meta';td.textContent=value}tr.appendChild(td)});tbody.appendChild(tr);
  });
}

function exportLibrary(){
  const header=['域名','标签','备注','最近状态','最终状态码','最近说明','最后检测时间','添加时间'];
  const rows=domains.map(item=>[item.domain,item.label,item.note,item.lastStatus,item.lastCode,item.lastNote,item.lastChecked,item.createdAt]);
  download('\uFEFF'+[header,...rows].map(row=>row.map(csvEscape).join(',')).join('\n'),`domain_library_${today()}.csv`,'text/csv;charset=utf-8');
}
function exportResults(){
  if(!currentResults.length){alert('暂无本次检测结果');return}const header=['域名','状态','首次状态码','最终状态码','响应时间','SSL','SSL说明','手机端','手机端说明','图片检查数','图片缺失数','说明'];
  const rows=currentResults.map(r=>[r.domain,r.status,r.firstCode||'—',r.code||'—',r.rt||'—',r.ssl||'—',r.sslNote||'',r.mobileScore||'—',r.mobileNote||'',r.imgChecked||0,r.imgBroken||0,r.note||'']);
  download('\uFEFF'+[header,...rows].map(row=>row.map(csvEscape).join(',')).join('\n'),`site_check_${today()}.csv`,'text/csv;charset=utf-8');
}
function parseCsv(text){
  const rows=[];let row=[],cell='',quoted=false;
  for(let i=0;i<text.length;i++){const ch=text[i];if(quoted){if(ch==='"'&&text[i+1]==='"'){cell+='"';i++}else if(ch==='"')quoted=false;else cell+=ch}else if(ch==='"')quoted=true;else if(ch===','){row.push(cell);cell=''}else if(ch==='\n'){row.push(cell);rows.push(row);row=[];cell=''}else if(ch!=='\r')cell+=ch}
  if(cell||row.length){row.push(cell);rows.push(row)}return rows;
}
async function importCsv(file){
  const text=await file.text();const rows=parseCsv(text.replace(/^\uFEFF/,''));if(rows.length<2){alert('CSV 内容为空或格式不正确');return}
  const header=rows[0].map(v=>v.trim());const index=name=>header.indexOf(name);const domainIndex=index('域名');if(domainIndex<0){alert('CSV 必须包含“域名”列');return}
  const map=new Map(domains.map(item=>[item.domain,item]));let count=0;
  rows.slice(1).forEach(row=>{const domain=canonicalDomain(row[domainIndex]);if(!domain)return;const existing=map.get(domain)||{domain,label:'',note:'',lastStatus:'',lastCode:'',lastNote:'',lastChecked:'',lastResult:null,createdAt:new Date().toISOString()};
    const get=name=>{const i=index(name);return i>=0?String(row[i]||'').trim():''};existing.label=get('标签')||existing.label;existing.note=get('备注')||existing.note;existing.lastStatus=get('最近状态')||existing.lastStatus;existing.lastCode=get('最终状态码')||existing.lastCode;existing.lastNote=get('最近说明')||existing.lastNote;existing.lastChecked=get('最后检测时间')||existing.lastChecked;map.set(domain,existing);count++});
  domains=[...map.values()];saveDomains();renderAll();toast(`已导入 ${count} 行记录`);
}
function copyProblems(){const list=currentResults.filter(r=>r.status!=='正常').map(r=>r.domain).join('\n');if(!list){alert('本次没有需处理域名');return}navigator.clipboard.writeText(list).then(()=>toast('已复制需处理域名'))}

$('domainInput').addEventListener('input',updateInputCount);$('clearInputBtn').addEventListener('click',()=>{domainInput.value='';updateInputCount()});$('addBtn').addEventListener('click',addDomains);
$('checkActiveBtn').addEventListener('click',()=>startCheck('active'));$('checkSelectedBtn').addEventListener('click',()=>startCheck('selected'));
$('searchInput').addEventListener('input',()=>{renderDomainTable();renderSelection()});document.querySelectorAll('.ftab').forEach(btn=>btn.addEventListener('click',()=>{currentFilter=btn.dataset.filter;document.querySelectorAll('.ftab').forEach(item=>item.classList.toggle('active',item===btn));renderDomainTable();renderSelection()}));
$('selectVisible').addEventListener('change',event=>{filteredDomains().forEach(item=>event.target.checked?selected.add(item.domain):selected.delete(item.domain));renderDomainTable();renderSelection()});
$('applyBulkLabelBtn').addEventListener('click',applyBulkLabel);$('deleteSelectedBtn').addEventListener('click',deleteSelected);
$('exportLibraryBtn').addEventListener('click',exportLibrary);$('exportResultsBtn').addEventListener('click',exportResults);$('copyProblemsBtn').addEventListener('click',copyProblems);
$('importBtn').addEventListener('click',()=>$('importFile').click());$('importFile').addEventListener('change',async event=>{const file=event.target.files[0];if(file)await importCsv(file);event.target.value=''});
updateInputCount();renderAll();
</script>
