<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>网站批量状态检测</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@400;600;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0e10;
    --surface: #18181c;
    --border: #2a2a30;
    --border2: #3a3a44;
    --text: #f0f0f4;
    --muted: #888894;
    --accent: #7fff7f;
    --accent-dim: #1a3a1a;
    --warn: #ffd060;
    --warn-dim: #3a3010;
    --err: #ff6060;
    --err-dim: #3a1010;
    --review: #a78bfa;
    --review-dim: #2a1a4a;
    --mobile-ok: #60c0ff;
    --mobile-dim: #0a2a3a;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'Syne', sans-serif;
  }

  body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; padding: 48px 24px 80px; }
  .container { max-width: 1100px; margin: 0 auto; }

  header { margin-bottom: 40px; }
  header h1 { font-size: clamp(28px, 5vw, 42px); font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; margin-bottom: 8px; }
  header h1 span { color: var(--accent); }
  header p { font-size: 14px; color: var(--muted); font-family: var(--mono); }

  .input-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 16px; }
  textarea { width: 100%; min-height: 160px; padding: 16px 18px; background: transparent; color: var(--text); font-family: var(--mono); font-size: 13px; line-height: 1.8; border: none; outline: none; resize: vertical; }
  textarea::placeholder { color: var(--muted); }

  .toolbar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .count { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-right: auto; }

  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 18px; font-size: 13px; font-weight: 600; font-family: var(--sans); border-radius: 8px; border: 1px solid var(--border2); background: transparent; color: var(--muted); cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  .btn:hover { border-color: var(--text); color: var(--text); }
  .btn.primary { background: var(--accent); color: #0a1a0a; border-color: var(--accent); }
  .btn.primary:hover { opacity: 0.88; }
  .btn.primary:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn.review-btn { border-color: var(--review); color: var(--review); }
  .btn.review-btn:hover { background: var(--review-dim); }
  .btn svg { width: 14px; height: 14px; flex-shrink: 0; }

  .progress-wrap { margin-bottom: 20px; display: none; }
  .progress-info { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .progress-bar { height: 2px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.3s; width: 0%; }

  .stats { display: none; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 24px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .stat-label { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.06em; }
  .stat-val { font-size: 26px; font-weight: 700; color: var(--text); }
  .stat-val.ok { color: var(--accent); }
  .stat-val.err { color: var(--err); }
  .stat-val.warn { color: var(--warn); }
  .stat-val.review { color: var(--review); }

  .filter-row { display: none; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; align-items: center; }
  .ftab { padding: 5px 14px; font-size: 12px; font-family: var(--mono); border-radius: 20px; border: 1px solid var(--border2); background: transparent; color: var(--muted); cursor: pointer; transition: all 0.15s; }
  .ftab.active { background: var(--text); color: var(--bg); border-color: var(--text); }
  .ftab.f-review.active { background: var(--review); color: #fff; border-color: var(--review); }
  .export-btns { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }

  /* 待审核侧边面板 */
  .review-panel { display: none; background: var(--review-dim); border: 1px solid var(--review); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
  .review-panel h3 { color: var(--review); font-size: 14px; font-family: var(--mono); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .review-panel p { font-size: 12px; color: var(--muted); margin-bottom: 14px; line-height: 1.6; }
  .review-list { display: flex; flex-direction: column; gap: 8px; }
  .review-item { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
  .review-item-domain { font-family: var(--mono); font-size: 13px; color: var(--text); margin-bottom: 4px; }
  .review-item-reason { font-size: 12px; color: var(--muted); margin-bottom: 8px; line-height: 1.5; }
  .review-item-actions { display: flex; gap: 8px; }
  .review-action { padding: 4px 12px; font-size: 11px; font-family: var(--mono); border-radius: 6px; border: 1px solid; cursor: pointer; background: transparent; transition: all 0.15s; }
  .review-action.ok   { border-color: var(--accent); color: var(--accent); }
  .review-action.ok:hover   { background: var(--accent-dim); }
  .review-action.bad  { border-color: var(--err); color: var(--err); }
  .review-action.bad:hover  { background: var(--err-dim); }
  .review-action.skip { border-color: var(--border2); color: var(--muted); }
  .review-action.skip:hover { background: var(--border); }

  .results-wrap { display: none; }
  .results-shell { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; overflow-x: auto; }
  .results-table { width: 100%; border-collapse: collapse; min-width: 900px; }
  .results-table th { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 400; padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .results-table td { padding: 10px 12px; font-size: 13px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .results-table tr:last-child td { border-bottom: none; }
  .results-table tr:hover td { background: rgba(255,255,255,0.02); }

  .domain-cell { font-family: var(--mono); font-size: 12px; }
  .domain-cell a { color: var(--text); text-decoration: none; }
  .domain-cell a:hover { color: var(--accent); }

  .badge { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 20px; font-family: var(--mono); font-size: 11px; font-weight: 500; white-space: nowrap; }
  .badge.ok     { background: var(--accent-dim); color: var(--accent); }
  .badge.err    { background: var(--err-dim); color: var(--err); }
  .badge.warn   { background: var(--warn-dim); color: var(--warn); }
  .badge.review { background: var(--review-dim); color: var(--review); }
  .badge.checking { background: var(--border); color: var(--muted); }

  .code-cell { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .rt-cell   { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
  .ssl-cell  { font-family: var(--mono); font-size: 11px; white-space: nowrap; }
  .ssl-cell.ssl-ok { color: var(--accent); } .ssl-cell.ssl-warn { color: var(--warn); } .ssl-cell.ssl-err { color: var(--err); } .ssl-cell.ssl-na { color: var(--muted); }

  .mobile-cell { font-size: 11px; font-family: var(--mono); white-space: nowrap; }
  .mobile-cell.mob-ok   { color: var(--mobile-ok); }
  .mobile-cell.mob-warn { color: var(--warn); }
  .mobile-cell.mob-err  { color: var(--err); }
  .mobile-cell.mob-na   { color: var(--muted); }

  .img-cell { font-family: var(--mono); font-size: 11px; }
  .img-cell.img-ok   { color: var(--accent); }
  .img-cell.img-warn { color: var(--warn); }
  .img-cell.img-na   { color: var(--muted); }

  .note-cell { font-size: 12px; color: var(--muted); max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .manual-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-family: var(--mono); margin-left: 6px; }
  .manual-ok  { background: var(--accent-dim); color: var(--accent); }
  .manual-bad { background: var(--err-dim); color: var(--err); }

  .empty-state { padding: 40px; text-align: center; font-family: var(--mono); font-size: 13px; color: var(--muted); }

  @media (max-width: 700px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    body { padding: 24px 12px 60px; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>网站批量<span>状态检测</span></h1>
    <p>// 每行一个域名 · 支持 example.com 或 https://example.com · 自动检测手机端适配</p>
  </header>

  <div class="input-card">
    <textarea id="input" placeholder="brisamassages.com&#10;cocospas.net&#10;a-plus-spa.com&#10;https://example.com"></textarea>
    <div class="toolbar">
      <span class="count" id="count-label">0 个域名</span>
      <button class="btn" onclick="clearAll()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>清空
      </button>
      <button class="btn primary" id="startBtn" onclick="startCheck()" disabled>
        <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>开始检测
      </button>
    </div>
  </div>

  <div class="progress-wrap" id="progress-wrap">
    <div class="progress-info"><span id="prog-label">检测中...</span><span id="prog-num">0 / 0</span></div>
    <div class="progress-bar"><div class="progress-fill" id="prog-fill"></div></div>
  </div>

  <div class="stats" id="stats">
    <div class="stat"><div class="stat-label">总计</div><div class="stat-val" id="s-total">0</div></div>
    <div class="stat"><div class="stat-label">正常</div><div class="stat-val ok" id="s-ok">0</div></div>
    <div class="stat"><div class="stat-label">异常</div><div class="stat-val err" id="s-err">0</div></div>
    <div class="stat"><div class="stat-label">需关注</div><div class="stat-val warn" id="s-warn">0</div></div>
    <div class="stat"><div class="stat-label">待审核</div><div class="stat-val review" id="s-review">0</div></div>
  </div>

  <!-- 待审核面板 -->
  <div class="review-panel" id="review-panel">
    <h3>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      待人工审核 · <span id="review-count">0</span> 个域名
    </h3>
    <p>以下域名自动检测无法确定内容是否正常，请人工打开网站核查后标记结果。标记后可导出完整 CSV。</p>
    <div class="review-list" id="review-list"></div>
  </div>

  <div class="filter-row" id="filter-row">
    <button class="ftab active" data-f="all"    onclick="setFilter('all',this)">全部</button>
    <button class="ftab" data-f="ok"            onclick="setFilter('ok',this)">✓ 正常</button>
    <button class="ftab" data-f="warn"          onclick="setFilter('warn',this)">⚠ 需关注</button>
    <button class="ftab" data-f="err"           onclick="setFilter('err',this)">✕ 异常</button>
    <button class="ftab f-review" data-f="review" onclick="setFilter('review',this)">◎ 待审核</button>
    <div class="export-btns">
      <button class="btn" onclick="exportCSV()">↓ 导出 CSV</button>
      <button class="btn review-btn" onclick="exportReviewCSV()">↓ 导出待审核 CSV</button>
      <button class="btn" onclick="copyFailed()">⎘ 复制异常域名</button>
    </div>
  </div>

  <div class="results-wrap" id="results-wrap">
    <div class="results-shell">
      <table class="results-table">
        <thead>
          <tr>
            <th>域名</th>
            <th>状态</th>
            <th>首次码</th>
            <th>最终码</th>
            <th>响应时间</th>
            <th>SSL证书</th>
            <th>手机端</th>
            <th>图片</th>
            <th>说明</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const textarea = document.getElementById('input');
const startBtn = document.getElementById('startBtn');
let allResults = [];
let manualReviews = {}; // domain -> 'ok' | 'bad' | null
let currentFilter = 'all';

textarea.addEventListener('input', updateCount);

function updateCount() {
  const n = parseDomains().length;
  document.getElementById('count-label').textContent = n + ' 个域名';
  startBtn.disabled = n === 0;
}

function parseDomains() {
  return textarea.value.split('\n').map(l => l.trim()).filter(l => l && !l.startsWith('#'));
}

function clearAll() {
  textarea.value = ''; allResults = []; manualReviews = {}; updateCount();
  ['progress-wrap','stats','filter-row','results-wrap','review-panel'].forEach(id => {
    document.getElementById(id).style.display = 'none';
  });
}

async function startCheck() {
  const domains = parseDomains();
  if (!domains.length) return;
  allResults = []; manualReviews = {}; currentFilter = 'all';
  document.querySelectorAll('.ftab').forEach(b => b.classList.toggle('active', b.dataset.f === 'all'));
  startBtn.disabled = true;
  startBtn.innerHTML = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> 检测中...';

  document.getElementById('progress-wrap').style.display = 'block';
  document.getElementById('stats').style.display = 'grid';
  document.getElementById('filter-row').style.display = 'flex';
  document.getElementById('results-wrap').style.display = 'block';
  document.getElementById('review-panel').style.display = 'none';
  document.getElementById('tbody').innerHTML = '<tr><td colspan="9" class="empty-state">正在检测，请稍候...</td></tr>';

  const BATCH = 8; // 并发手机+PC请求，降低batch大小
  const total = domains.length;
  let done = 0;

  for (let i = 0; i < domains.length; i += BATCH) {
    const batch = domains.slice(i, i + BATCH);
    try {
      const resp = await fetch('/api/check', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ domains: batch }) });
      const data = await resp.json();
      allResults.push(...data.results);
    } catch(e) {
      batch.forEach(d => allResults.push({ domain:d, status:'请求失败', code:'—', firstCode:'—', rt:'—', ssl:'—', sslNote:'', sslDays:null, content:'—', contentNote:'', title:'', note:'无法连接到检测服务', redirect_to:'', reviewReason:'', mobileScore:'—', mobileNote:'', imgBroken:0, imgChecked:0 }));
    }
    done = Math.min(i + BATCH, total);
    document.getElementById('prog-fill').style.width = Math.round(done/total*100) + '%';
    document.getElementById('prog-num').textContent = done + ' / ' + total;
    document.getElementById('prog-label').textContent = `已完成 ${done} / ${total}`;
    renderTable(); updateStats(); renderReviewPanel();
  }

  document.getElementById('prog-label').textContent = '✓ 检测完成';
  startBtn.disabled = false;
  startBtn.innerHTML = '<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg> 重新检测';
}

function statusClass(s) {
  if (s === '正常') return 'ok';
  if (s === '待审核') return 'review';
  if (['重定向','需要认证','禁止访问','SSL错误','网关错误','内容异常','手机端异常','需关注'].includes(s)) return 'warn';
  return 'err';
}

function renderTable() {
  const filtered = currentFilter === 'all'    ? allResults :
    currentFilter === 'ok'     ? allResults.filter(r => r.status === '正常') :
    currentFilter === 'warn'   ? allResults.filter(r => statusClass(r.status) === 'warn') :
    currentFilter === 'err'    ? allResults.filter(r => statusClass(r.status) === 'err') :
    currentFilter === 'review' ? allResults.filter(r => r.status === '待审核') : allResults;

  if (!filtered.length) { document.getElementById('tbody').innerHTML = '<tr><td colspan="9" class="empty-state">暂无数据</td></tr>'; return; }

  document.getElementById('tbody').innerHTML = filtered.map(r => {
    const sc = statusClass(r.status);
    const sslCls = r.ssl==='✓'?'ssl-ok':r.ssl==='⚠'?'ssl-warn':r.ssl==='✗'?'ssl-err':'ssl-na';
    const sslLabel = (r.ssl||'—') + (r.sslNote?' '+r.sslNote:'');

    // 手机端列
    const mobScore = r.mobileScore || '—';
    const mobCls = mobScore==='正常'?'mob-ok':mobScore==='需关注'?'mob-warn':mobScore==='异常'?'mob-err':'mob-na';
    const mobIcon = mobScore==='正常'?'✓ 正常':mobScore==='需关注'?'⚠ 需关注':mobScore==='异常'?'✕ 异常':'—';

    // 图片列
    const imgBroken = r.imgBroken || 0;
    const imgChecked = r.imgChecked || 0;
    // 图片缺失不再标红警告，只展示数量；缺失情况已记录在 mobileNote 里
    const imgCls = imgChecked === 0 ? 'img-na' : 'img-ok';
    const imgLabel = imgChecked === 0 ? '—' : (imgBroken > 0
      ? `${imgChecked - imgBroken}/${imgChecked} 可用`
      : `✓ ${imgChecked} 正常`);

    // 手动审核标记
    const mv = manualReviews[r.domain];
    const mvBadge = mv==='ok'?'<span class="manual-badge manual-ok">已确认正常</span>':mv==='bad'?'<span class="manual-badge manual-bad">已标记异常</span>':'';

    return `<tr>
      <td class="domain-cell"><a href="${r.url||'#'}" target="_blank" rel="noopener">${r.domain}</a>${mvBadge}</td>
      <td><span class="badge ${sc}">${r.status}</span></td>
      <td class="code-cell">${r.firstCode||'—'}</td>
      <td class="code-cell">${r.code||'—'}</td>
      <td class="rt-cell">${r.rt||'—'}</td>
      <td class="ssl-cell ${sslCls}" title="${r.sslNote||''}">${sslLabel}</td>
      <td class="mobile-cell ${mobCls}" title="${(r.mobileNote||'').replace(/"/g,'&quot;')}">${mobIcon}</td>
      <td class="img-cell ${imgCls}">${imgLabel}</td>
      <td class="note-cell" title="${(r.note||'').replace(/"/g,'&quot;')}">${r.redirect_to?'→ '+r.redirect_to:(r.note||'')}</td>
    </tr>`;
  }).join('');
}

function updateStats() {
  const ok     = allResults.filter(r => r.status==='正常').length;
  const err    = allResults.filter(r => statusClass(r.status)==='err').length;
  const warn   = allResults.filter(r => statusClass(r.status)==='warn').length;
  const review = allResults.filter(r => r.status==='待审核').length;
  document.getElementById('s-total').textContent  = allResults.length;
  document.getElementById('s-ok').textContent     = ok;
  document.getElementById('s-err').textContent    = err;
  document.getElementById('s-warn').textContent   = warn;
  document.getElementById('s-review').textContent = review;
}

function renderReviewPanel() {
  const pending = allResults.filter(r => r.status === '待审核');
  const panel = document.getElementById('review-panel');
  if (pending.length === 0) { panel.style.display = 'none'; return; }
  panel.style.display = 'block';
  document.getElementById('review-count').textContent = pending.length;

  document.getElementById('review-list').innerHTML = pending.map(r => {
    const mv = manualReviews[r.domain];
    const doneClass = mv ? 'style="opacity:0.5"' : '';
    return `<div class="review-item" id="ri-${CSS.escape(r.domain)}" ${doneClass}>
      <div class="review-item-domain">
        <a href="${r.url||'#'}" target="_blank" rel="noopener" style="color:var(--review);text-decoration:none">${r.domain} ↗</a>
      </div>
      <div class="review-item-reason">${r.reviewReason || r.note || r.contentNote || '内容不确定'}</div>
      <div class="review-item-actions">
        <button class="review-action ok"   onclick="markReview('${r.domain}','ok')">✓ 内容正常</button>
        <button class="review-action bad"  onclick="markReview('${r.domain}','bad')">✕ 内容异常</button>
        <button class="review-action skip" onclick="markReview('${r.domain}','skip')">跳过</button>
      </div>
    </div>`;
  }).join('');
}

function markReview(domain, verdict) {
  manualReviews[domain] = verdict === 'skip' ? null : verdict;
  // 更新对应结果的状态
  const r = allResults.find(x => x.domain === domain);
  if (r && verdict !== 'skip') {
    r._manualVerdict = verdict;
  }
  renderReviewPanel();
  renderTable();
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.ftab').forEach(b => b.classList.toggle('active', b === btn));
  renderTable();
}

function exportCSV() {
  const header = '域名,状态,人工审核,首次状态码,最终状态码,响应时间,SSL,SSL说明,手机端,手机端说明,图片检查数,图片缺失数,说明\n';
  const rows = allResults.map(r => {
    const mv = manualReviews[r.domain];
    const mvLabel = mv==='ok'?'已确认正常':mv==='bad'?'已标记异常':r.status==='待审核'?'未审核':'—';
    return `"${r.domain}","${r.status}","${mvLabel}","${r.firstCode||'—'}","${r.code||'—'}","${r.rt||'—'}","${r.ssl||'—'}","${r.sslNote||''}","${r.mobileScore||'—'}","${(r.mobileNote||'').replace(/"/g,'""')}","${r.imgChecked||0}","${r.imgBroken||0}","${(r.note||'').replace(/"/g,'""')}"`;
  }).join('\n');
  download('\uFEFF' + header + rows, `site_check_${today()}.csv`, 'text/csv;charset=utf-8');
}

function exportReviewCSV() {
  const pending = allResults.filter(r => r.status === '待审核');
  if (!pending.length) { alert('没有待审核域名'); return; }
  const header = '域名,网址,审核原因,人工标记\n';
  const rows = pending.map(r => {
    const mv = manualReviews[r.domain];
    const mvLabel = mv==='ok'?'已确认正常':mv==='bad'?'已标记异常':'未审核';
    return `"${r.domain}","${r.url||''}","${(r.reviewReason||r.note||'').replace(/"/g,'""')}","${mvLabel}"`;
  }).join('\n');
  download('\uFEFF' + header + rows, `review_${today()}.csv`, 'text/csv;charset=utf-8');
}

function copyFailed() {
  const failed = allResults.filter(r => statusClass(r.status)==='err').map(r => r.domain).join('\n');
  if (!failed) { alert('没有异常域名'); return; }
  navigator.clipboard.writeText(failed).then(() => alert(`已复制 ${failed.split('\n').length} 个异常域名`));
}

function download(content, filename, type) {
  const blob = new Blob([content], { type });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}

function today() { return new Date().toISOString().slice(0,10); }

updateCount();
</script>
</body>
</html>
