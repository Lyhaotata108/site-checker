<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>网站批量状态检测</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@400;600;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0e10;
    --surface: #18181c;
    --border: #2a2a30;
    --border2: #3a3a44;
    --text: #f0f0f4;
    --muted: #888894;
    --accent: #7fff7f;
    --accent-dim: #1a3a1a;
    --warn: #ffd060;
    --warn-dim: #3a3010;
    --err: #ff6060;
    --err-dim: #3a1010;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'Syne', sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    padding: 48px 24px 80px;
  }

  .container { max-width: 860px; margin: 0 auto; }

  header { margin-bottom: 40px; }
  header h1 {
    font-size: clamp(28px, 5vw, 42px);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.1;
    margin-bottom: 8px;
  }
  header h1 span { color: var(--accent); }
  header p { font-size: 14px; color: var(--muted); font-family: var(--mono); }

  .input-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 16px;
  }
  textarea {
    width: 100%; min-height: 160px;
    padding: 16px 18px;
    background: transparent;
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.8;
    border: none; outline: none; resize: vertical;
  }
  textarea::placeholder { color: var(--muted); }

  .toolbar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .count { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-right: auto; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 18px; font-size: 13px; font-weight: 600;
    font-family: var(--sans);
    border-radius: 8px; border: 1px solid var(--border2);
    background: transparent; color: var(--muted);
    cursor: pointer; transition: all 0.15s;
  }
  .btn:hover { border-color: var(--text); color: var(--text); }
  .btn.primary {
    background: var(--accent); color: #0a1a0a;
    border-color: var(--accent);
  }
  .btn.primary:hover { opacity: 0.88; }
  .btn.primary:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn svg { width: 14px; height: 14px; }

  /* progress */
  .progress-wrap { margin-bottom: 20px; display: none; }
  .progress-info { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .progress-bar { height: 2px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.3s; width: 0%; }

  /* stats */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; display: none; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .stat-label { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.06em; }
  .stat-val { font-size: 26px; font-weight: 700; color: var(--text); }
  .stat-val.ok { color: var(--accent); }
  .stat-val.err { color: var(--err); }
  .stat-val.warn { color: var(--warn); }

  /* filters */
  .filter-row { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; display: none; }
  .ftab {
    padding: 5px 14px; font-size: 12px; font-family: var(--mono);
    border-radius: 20px; border: 1px solid var(--border2);
    background: transparent; color: var(--muted); cursor: pointer; transition: all 0.15s;
  }
  .ftab.active { background: var(--text); color: var(--bg); border-color: var(--text); }
  .export-btns { margin-left: auto; display: flex; gap: 8px; }

  /* table */
  .results-wrap { display: none; }
  .results-table { width: 100%; border-collapse: collapse; }
  .results-table th {
    font-family: var(--mono); font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--muted); font-weight: 400;
    padding: 8px 14px; text-align: left;
    border-bottom: 1px solid var(--border);
  }
  .results-table td {
    padding: 11px 14px; font-size: 13px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  .results-table tr:last-child td { border-bottom: none; }
  .results-table tr:hover td { background: var(--surface); }

  .domain-cell { font-family: var(--mono); font-size: 12px; }
  .domain-cell a { color: var(--text); text-decoration: none; }
  .domain-cell a:hover { color: var(--accent); }

  .badge {
    display: inline-flex; align-items: center;
    padding: 3px 10px; border-radius: 20px;
    font-family: var(--mono); font-size: 11px; font-weight: 500; white-space: nowrap;
  }
  .badge.ok  { background: var(--accent-dim); color: var(--accent); }
  .badge.err { background: var(--err-dim); color: var(--err); }
  .badge.warn { background: var(--warn-dim); color: var(--warn); }
  .badge.checking { background: var(--border); color: var(--muted); }

  .code-cell { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .code-cell.first-code { color: var(--warn); font-weight: 500; }
  .rt-cell   { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .ssl-cell  { font-family: var(--mono); font-size: 11px; white-space: nowrap; }
  .ssl-cell.ssl-ok   { color: var(--accent); }
  .ssl-cell.ssl-warn { color: var(--warn); }
  .ssl-cell.ssl-err  { color: var(--err); }
  .ssl-cell.ssl-na   { color: var(--muted); }
  .content-cell { font-family: var(--mono); font-size: 11px; white-space: nowrap; }
  .content-cell.content-ok   { color: var(--accent); }
  .content-cell.content-warn { color: var(--warn); }
  .content-cell.content-na   { color: var(--muted); }
  .note-cell { font-size: 12px; color: var(--muted); max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .results-shell {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  .empty-state { padding: 40px; text-align: center; font-family: var(--mono); font-size: 13px; color: var(--muted); }

  @media (max-width: 600px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .results-table th:nth-child(4),
    .results-table td:nth-child(4),
    .results-table th:nth-child(5),
    .results-table td:nth-child(5),
    .results-table th:nth-child(8),
    .results-table td:nth-child(8) { display: none; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>网站批量<span>状态检测</span></h1>
    <p>// 每行一个域名，支持 example.com 或 https://example.com</p>
  </header>

  <div class="input-card">
    <textarea id="input" placeholder="campbellfoot-massage.com
brisamassages.com
myoldproject.net
https://example.com"></textarea>
    <div class="toolbar">
      <span class="count" id="count-label">0 个域名</span>
      <button class="btn" onclick="clearAll()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>
        清空
      </button>
      <button class="btn primary" id="startBtn" onclick="startCheck()" disabled>
        <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        开始检测
      </button>
    </div>
  </div>

  <div class="progress-wrap" id="progress-wrap">
    <div class="progress-info">
      <span id="prog-label">检测中...</span>
      <span id="prog-num">0 / 0</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="prog-fill"></div></div>
  </div>

  <div class="stats" id="stats">
    <div class="stat"><div class="stat-label">总计</div><div class="stat-val" id="s-total">0</div></div>
    <div class="stat"><div class="stat-label">正常</div><div class="stat-val ok" id="s-ok">0</div></div>
    <div class="stat"><div class="stat-label">异常</div><div class="stat-val err" id="s-err">0</div></div>
    <div class="stat"><div class="stat-label">需关注</div><div class="stat-val warn" id="s-warn">0</div></div>
  </div>

  <div class="filter-row" id="filter-row">
    <button class="ftab active" data-f="all" onclick="setFilter('all',this)">全部</button>
    <button class="ftab" data-f="ok" onclick="setFilter('ok',this)">✓ 正常</button>
    <button class="ftab" data-f="warn" onclick="setFilter('warn',this)">⚠ 需关注</button>
    <button class="ftab" data-f="err" onclick="setFilter('err',this)">✕ 异常</button>
    <div class="export-btns">
      <button class="btn" onclick="exportCSV()">↓ 导出 CSV</button>
      <button class="btn" onclick="copyFailed()">⎘ 复制异常域名</button>
    </div>
  </div>

  <div class="results-wrap" id="results-wrap">
    <div class="results-shell">
      <table class="results-table">
        <thead>
          <tr>
            <th>域名</th>
            <th>状态</th>
            <th>首次状态码</th>
            <th>最终状态码</th>
            <th>响应时间</th>
            <th>SSL证书</th>
            <th>内容</th>
            <th>说明</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const textarea = document.getElementById('input');
const startBtn = document.getElementById('startBtn');
let allResults = [];
let currentFilter = 'all';

textarea.addEventListener('input', updateCount);

function updateCount() {
  const n = parseDomains().length;
  document.getElementById('count-label').textContent = n + ' 个域名';
  startBtn.disabled = n === 0;
}

function parseDomains() {
  return textarea.value.split('\n').map(l => l.trim()).filter(l => l && !l.startsWith('#'));
}

function clearAll() {
  textarea.value = '';
  allResults = [];
  updateCount();
  ['progress-wrap','stats','filter-row','results-wrap'].forEach(id => {
    document.getElementById(id).style.display = 'none';
  });
}

async function startCheck() {
  const domains = parseDomains();
  if (!domains.length) return;

  allResults = [];
  currentFilter = 'all';
  document.querySelectorAll('.ftab').forEach(b => b.classList.toggle('active', b.dataset.f === 'all'));

  startBtn.disabled = true;
  startBtn.innerHTML = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> 检测中...';

  document.getElementById('progress-wrap').style.display = 'block';
  document.getElementById('stats').style.display = 'grid';
  document.getElementById('filter-row').style.display = 'flex';
  document.getElementById('results-wrap').style.display = 'block';
  document.getElementById('tbody').innerHTML = '<tr><td colspan="8" class="empty-state">正在检测，请稍候...</td></tr>';

  const BATCH = 10;
  const total = domains.length;
  let done = 0;

  for (let i = 0; i < domains.length; i += BATCH) {
    const batch = domains.slice(i, i + BATCH);
    try {
      const resp = await fetch('/api/check', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ domains: batch })
      });
      const data = await resp.json();
      allResults.push(...data.results);
    } catch(e) {
      batch.forEach(d => allResults.push({
        domain: d, status: '请求失败', code: '—', firstCode: '—', rt: '—', ssl: '—', sslNote: '', sslDays: null,
        content: '—', contentNote: '', title: '', note: '无法连接到检测服务', redirect_to: ''
      }));
    }
    done = Math.min(i + BATCH, total);
    const pct = Math.round(done / total * 100);
    document.getElementById('prog-fill').style.width = pct + '%';
    document.getElementById('prog-num').textContent = done + ' / ' + total;
    document.getElementById('prog-label').textContent = `已完成 ${done} / ${total}`;
    renderTable();
    updateStats();
  }

  document.getElementById('prog-label').textContent = '✓ 检测完成';
  startBtn.disabled = false;
  startBtn.innerHTML = '<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg> 重新检测';
}

function statusClass(s) {
  if (s === '正常') return 'ok';
  if (['重定向','需要认证','禁止访问','SSL错误','网关错误','内容异常'].includes(s)) return 'warn';
  return 'err';
}

function renderTable() {
  const filtered = currentFilter === 'all' ? allResults :
    currentFilter === 'ok'   ? allResults.filter(r => r.status === '正常') :
    currentFilter === 'warn' ? allResults.filter(r => statusClass(r.status) === 'warn') :
    allResults.filter(r => statusClass(r.status) === 'err');

  if (!filtered.length) {
    document.getElementById('tbody').innerHTML = '<tr><td colspan="8" class="empty-state">暂无数据</td></tr>';
    return;
  }

  document.getElementById('tbody').innerHTML = filtered.map(r => {
    const sc = statusClass(r.status);
    const first = r.firstCode ?? '—';
    const redirected = first !== '—' && r.code !== '—' && String(first) !== String(r.code);
    const sslCls = r.ssl === '✓' ? 'ssl-ok' : r.ssl === '⚠' ? 'ssl-warn' : r.ssl === '✗' ? 'ssl-err' : 'ssl-na';
    const sslLabel = (r.ssl || '—') + (r.sslNote ? ' ' + r.sslNote : '');
    const contentCls = r.content === '正常' ? 'content-ok' : r.content === '可疑' ? 'content-warn' : 'content-na';
    const contentLabel = r.content === '正常' ? '✓ 正常' : r.content === '可疑' ? '⚠ 可疑' : '—';
    return `<tr>
      <td class="domain-cell"><a href="${r.url}" target="_blank" rel="noopener">${r.domain}</a></td>
      <td><span class="badge ${sc}">${r.status}</span></td>
      <td class="code-cell ${redirected ? 'first-code' : ''}">${first}</td>
      <td class="code-cell">${r.code}</td>
      <td class="rt-cell">${r.rt}</td>
      <td class="ssl-cell ${sslCls}" title="${r.sslNote || ''}">${sslLabel}</td>
      <td class="content-cell ${contentCls}" title="${(r.contentNote || '').replace(/"/g,'&quot;')}">${contentLabel}</td>
      <td class="note-cell" title="${r.note}">${r.redirect_to ? '→ ' + r.redirect_to : r.note}</td>
    </tr>`;
  }).join('');
}

function updateStats() {
  const ok   = allResults.filter(r => r.status === '正常').length;
  const err  = allResults.filter(r => statusClass(r.status) === 'err').length;
  const warn = allResults.filter(r => statusClass(r.status) === 'warn').length;
  document.getElementById('s-total').textContent = allResults.length;
  document.getElementById('s-ok').textContent    = ok;
  document.getElementById('s-err').textContent   = err;
  document.getElementById('s-warn').textContent  = warn;
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.ftab').forEach(b => b.classList.toggle('active', b === btn));
  renderTable();
}

function exportCSV() {
  const header = '域名,状态,首次状态码,最终状态码,响应时间,SSL,SSL说明,内容,内容说明,说明\n';
  const rows = allResults.map(r =>
    `"${r.domain}","${r.status}","${r.firstCode ?? '—'}","${r.code}","${r.rt}","${r.ssl}","${r.sslNote || ''}","${r.content || '—'}","${(r.contentNote || '').replace(/"/g,'""')}","${r.note}"`
  ).join('\n');
  const blob = new Blob(['\uFEFF' + header + rows], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `site_check_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

function copyFailed() {
  const failed = allResults.filter(r => statusClass(r.status) === 'err').map(r => r.domain).join('\n');
  if (!failed) { alert('没有异常域名'); return; }
  navigator.clipboard.writeText(failed).then(() => {
    alert(`已复制 ${failed.split('\n').length} 个异常域名`);
  });
}

updateCount();
</script>
</body>
</html>
